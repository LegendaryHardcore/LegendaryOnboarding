plugins {
    id "java"
}

tasks.named("jar") {
    enabled = false
}

def deployableProjects = [
        project(":paper"),
        project(":folia"),
        project(":canvas")
]

tasks.register("collectPlatformJars", Copy) {
    group = "distribution"
    description = "Collects all deployable platform jars into the top-level dist directory."

    deployableProjects.each { platformProject ->
        def shadowJar = platformProject.tasks.named("shadowJar")
        dependsOn(shadowJar)
        from(shadowJar.flatMap { it.archiveFile })
    }

    into(layout.projectDirectory.dir("dist"))
}

tasks.named("build") {
    dependsOn("collectPlatformJars")
}

tasks.named("clean") {
    delete(layout.projectDirectory.dir("dist"))
}

allprojects {
    group = "org.LegendaryHardcore"
    version = "1.1.1"

    repositories {
        mavenCentral()
        maven {
            name = "papermc-repo"
            url = "https://repo.papermc.io/repository/maven-public/"
        }
    }
}

subprojects {
    apply plugin: "java"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release.set(21)
    }
}
