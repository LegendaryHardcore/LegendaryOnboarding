name: ${name}
version: ${version}
main: org.LegendaryHardcore.legendaryonboarding.canvas.CanvasLegendaryOnboarding
api-version: '1.21'
folia-supported: true
authors: [Natonite, Thowan]
loadbefore: [TabCompleteFilter]
softdepend: [ChatControl, ChatControlRed]

commands:
  accept:
    description: Accept the server rules
    usage: /accept
    permission: legendaryonboarding.accept
  legendaryonboarding:
    description: Manage LegendaryOnboarding
    usage: /legendaryonboarding <help | reload | status | debug>
    aliases: [lo]

permissions:
  legendaryonboarding.accept:
    default: true
  legendaryonboarding.reload:
    default: op
  legendaryonboarding.status:
    default: op
  legendaryonboarding.debug:
    default: op
