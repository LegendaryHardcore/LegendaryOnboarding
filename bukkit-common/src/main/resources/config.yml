# Available as {server_name} in titlesequence.yml.
SERVER_NAME: "Example Server"

ONBOARDSETTINGS:
  # Player game mode during onboarding: survival, creative, spectator, or adventure
  # Recommended to use adventure, no tp, no issues with blindness fog
  GAMEMODE: adventure

  # If false, onboarding runs where the player first joins.
  TELEPORT: false

  # If teleport is true, set the following settings to set the teleport location.
  POS_WORLD: "world"

  # Used when POS_WORLD is not loaded: NORMAL, NETHER, or THE_END.
  POS_WORLD_TYPE: "NORMAL"
  POS_X: 0
  POS_Y: 120
  POS_Z: 0
  POS_YAW: 0
  POS_PITCH: 0

  # Prevents advancements while a player is in an onboarding world.
  BLOCK_ADVANCEMENTS: true

  # Optional recovery location used when the player's saved return location is
  # unavailable or unsafe.
  CLEANUP_FALLBACK_ENABLED: false
  CLEANUP_FALLBACK_WORLD: "world"
  # Used when CLEANUP_FALLBACK_WORLD is not loaded: NORMAL, NETHER, or THE_END.
  CLEANUP_FALLBACK_WORLD_TYPE: "NORMAL"
  CLEANUP_FALLBACK_X: 0
  CLEANUP_FALLBACK_Y: 64
  CLEANUP_FALLBACK_Z: 0
  CLEANUP_FALLBACK_YAW: 0
  CLEANUP_FALLBACK_PITCH: 0
  # Randomize fallback X and Z independently within this distance from the
  # configured fallback coordinates. Set to 0 to use the fixed fallback area.
  CLEANUP_FALLBACK_RADIUS: 5000
  # Preferred Y level when returning players near their saved X/Z or a world
  # spawn. The plugin still requires safe ground and two passable blocks.
  RETURN_DESIRED_Y: 64

  FORCE_RETURNING_PLAYERS: false

  # hide server messages/broadcasts from the player onboarding
  BLOCK_EXTERNAL_MESSAGES_DURING_ONBOARDING: true
  # Hide onboarding players from other players' tab lists. They are restored when onboarding ends.
  HIDE_ONBOARDING_PLAYERS_FROM_TAB: true
  # Sent to a player who attempts to damage someone currently onboarding.
  # Available placeholder: {player}. Set to "" to disable.
  DAMAGE_MESSAGE: "{yellow}{player} is currently onboarding."
  # Message sent, in game chat, when a player exits onboarding outside of a debug state
  INGAME_FIRST_JOIN_MESSAGE: "{yellow}{player} joined the server for the first time"

  # Commands allowed before the player accepts the rules.
  # Use lowercase names without a leading slash.
  COMMAND_WHITELIST:
    - accept
    - help
    - rules
    - discord

  # Join and quit message consumption controls for while a player is onboarding
  # - NONE: Do not consume the message event
  # - SOME: Consume only the join and quit messages for those onboarding
  # - ALL: Consume all join and quit messages and reproduce them
  #     THIS MUST BE USED FOR ***DISCORDSRV*** TO WORK
  #     MAKE SURE THAT DISCORDSRV'S JOIN AND QUIT MESSAGES ARE DISABLED
  MESSAGE_CONSUMPTION:
    IN_GAME:
      JOIN: "SOME"
      QUIT: "SOME"
    DISCORDSRV:
      JOIN: "ALL"
      QUIT: "ALL"

  EVENT_PRIORITIES:
    CHAT_CONSUMPTION: "HIGHEST"
    JOIN_MESSAGE: "HIGHEST"
    QUIT_MESSAGE: "HIGHEST"

# Debugging types:
# - FORCE_ONBOARDING: Used to blanket test onboarding.
# - LOG_START: Log when a player starts onboarding.
# - LOG_END: Log when a player ends onboarding.
# - LOG_SEQUENCE_START: Log when the onboarding sequence begins, including
#   announcement and forced-debug state.
# - LOG_RETURN_LOCATION_CAPTURE: Log the pre-onboarding location that is saved
#   as the player's return destination.
# - LOG_RETURN_LOCATION_REUSE: Log when a resumed session keeps its original
#   saved return destination rather than capturing a new one.
# - LOG_RETURN_LOCATION_RESOLUTION: Log return-location lookup attempts and the
#   safe destination selected for cleanup or completion.
# - LOG_DEPARTURE_CLEANUP: Log disconnect, kick, shutdown, and forced-cleanup
#   decisions, including pending and cleanup-marker state.
# - LOG_JOIN_QUIT_MESSAGE_HANDLING: Log in-game and DiscordSRV join/quit modes
#   plus whether the native message is consumed or replaced.
# - LOG_DISCORDSRV_AVATAR: Log the DiscordSRV-generated player-face URL used
#   for direct Discord announcements.
# - LOG_ACTION_BAR_LIFECYCLE: Log action-bar clears, countdown sends, remaining
#   seconds, refresh interval, and countdown completion.
# - LOG_DEBUG_FIX_CLEANUP: Log action-bar cleanup performed by debug-fix and
#   forced-cleanup flows.
DEBUG: []
